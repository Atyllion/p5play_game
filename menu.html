<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Menu</title>
</head>
<body>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #282c34;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
    }

    h1 {
        font-size: 3em;
        margin-bottom: 0.5em;
    }

    p {
        font-size: 1.2em;
        margin: 0.5em 0;
        text-align: center;
        max-width: 600px;
    }

    button {
        background-color: #61dafb;
        border: none;
        padding: 1em 2em;
        font-size: 1.2em;
        cursor: pointer;
        border-radius: 5px;
        margin-top: 1em;
        transition: background-color 0.3s;
    }

    button:hover {
        background-color: #21a1f1;
    }
</style>
<style>
    p {
        font-size: 1.2em;
        margin: 0.5em 0;
        text-align: center;
        max-width: 600px;
        line-height: 1.5em;
        letter-spacing: 0.05em;
    }
</style>
<h1>Welcome to the Game</h1>
<p>In this game, you will control a player to shoot enemies and repair friends. <br> Use the <strong>ZQSD</strong> keys to move, left mouse button to shoot damage bullets, and right mouse button to shoot repair bullets and repair phones. <br>
You win the game when you reach <strong>3000</strong> Score. </p>
<button onclick="startGame()">Start Game</button>

<script>
    function startGame() {
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
