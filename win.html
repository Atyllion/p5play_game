<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win</title>
</head>
<body>
    
</body>
<style>
    body {
        background-color: green;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: 'Arial', sans-serif;
        overflow: hidden;
    }
    .win-screen {
        text-align: center;
        animation: fadeIn 2s ease-in-out;
    }
    .win-screen h1 {
        font-size: 4em;
        margin: 0;
        animation: pulse 1.5s infinite;
    }
    .win-screen p {
        font-size: 1.5em;
        animation: slideIn 1s ease-in-out;
    }
    .win-screen button {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 1em;
        background-color: blue;
        color: white;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s, transform 0.3s;
    }
    .win-screen button:hover {
        background-color: darkblue;
        transform: scale(1.1);
    }
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
    }
    @keyframes slideIn {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }
</style>

<div class="win-screen">
    <h1>Congratulations !</h1>
    <p>You have successfully cleaned your inbox !</p>
    <p>Remember, cleaning your inbox help reducing the Co2 emission and digital footprint,<br> so what are you waiting for ?</p>
    <p>Score : <span id="score"></span></p>
    <button onclick="restartGame()">Play Again</button>
    <button onclick="window.location.href = './menu.html'">Back to Menu</button>
</div>

<script>
    function restartGame() {
        window.location.href = 'index.html'; // Redirect to the main game page
    }

    // Retrieve the score from localStorage and display it in the span element
    const score = localStorage.getItem('score') || '0';
    document.getElementById('score').textContent = score;
</script>
